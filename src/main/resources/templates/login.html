<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NoteIt - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5" style="max-width: 440px;">
    <h1 class="mb-4">NoteIt</h1>

    <div th:if="${param.error}" class="alert alert-danger">Wrong username or password</div>
    <div th:if="${param.logout}" class="alert alert-info">You have been logged out</div>
    <div th:if="${param.registered}" class="alert alert-success">Account created, you can log in now</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username or email</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>

    <p class="mt-3 text-center">No account yet? <a th:href="@{/register}">Register</a></p>
</body>
</html>
